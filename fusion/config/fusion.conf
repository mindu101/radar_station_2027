# 融合参数。所有距离单位为米，时间单位为秒。
# 由 fusion_udp_listener --config 或 FusionConfig::load() 读取。

# 相机检测与激光轨迹的最大关联距离。
gate = 1.2
# 优先沿用上次绑定的激光轨迹，避免在两个轨迹间来回跳。
switch_penalty = 0.25

# 相机样本视为新鲜的时间；超过后开始用激光延续身份。
camera_ttl = 0.35
# 只有相机时，最多外推多久；超过就丢弃。
camera_hold = 0.8
# 相机丢失后，靠激光轨迹保留身份的最长时间。
identity_ttl = 2.0
# 激光轨迹多久没更新视为失效。
lidar_ttl = 0.6

# 相机和激光都新鲜时的位置权重：0=纯相机，1=纯激光。
lidar_weight = 0.7

# 速度低通系数（新测量权重）。
camera_velocity_alpha = 0.35
lidar_velocity_alpha = 1.0

# 无线电兜底（0x0A01 / 解波）。
use_radio = false
radio_ttl = 0.5
radio_gate = 2.0

# 是否输出没有身份的激光轨迹（label=-1）。
include_unlabeled = true

# 低于该置信度的相机检测丢弃。
min_camera_confidence = 0.0
